[pytest]
markers =
    api: exercises the external Restful Booker API
    smoke: critical checks of core API behavior
    regression: broader API verification including boundaries and CRUD
    negative: checks invalid inputs or rejected operations
    crud: checks the booking create/read/update/delete lifecycle
    data_driven: runs the same behavior against multiple inputs
    flaky: retry demonstration requiring pytest-rerunfailures
    ui: browser-based end-to-end checks against a demo application

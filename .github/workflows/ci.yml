name: QA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      RESTFUL_BOOKER_BASE_URL: ${{ vars.RESTFUL_BOOKER_BASE_URL || 'https://restful-booker.herokuapp.com' }}
      RESTFUL_BOOKER_USERNAME: ${{ secrets.RESTFUL_BOOKER_USERNAME || 'admin' }}
      RESTFUL_BOOKER_PASSWORD: ${{ secrets.RESTFUL_BOOKER_PASSWORD || 'password123' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install API test dependencies
        run: python -m pip install pytest requests jsonschema pytest-html

      - name: Run API tests
        run: |
          mkdir -p test-results
          python -m pytest api-tests -m api -v \
            --junitxml="test-results/api-${{ matrix.python-version }}.xml" \
            --html="test-results/api-${{ matrix.python-version }}.html" \
            --self-contained-html

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-python-${{ matrix.python-version }}
          path: test-results/api-${{ matrix.python-version }}.*
          if-no-files-found: ignore
          retention-days: 14

  qa-copilot-checks:
    name: QA-Copilot lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install check tools
        run: |
          python -m pip install pytest ruff
          python -m pip install -r qa-copilot/requirements.txt

      - name: Lint QA-Copilot source
        run: ruff check qa-copilot

      - name: Run offline unit tests
        run: |
          mkdir -p test-results
          python -m pytest -q \
            "Day 7 - Advanced pytest and data-driven testing" \
            "Day 8 - Playwright basics/test_playwright_adapter.py" \
            "Day 11 - Prompting for Test Design/test_prompt_outputs.py" \
            "qa-copilot/tests" \
            --junitxml=test-results/qa-copilot-unit.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-copilot-unit-report
          path: test-results/qa-copilot-unit.xml
          if-no-files-found: ignore
          retention-days: 14

  playwright-tests:
    name: Playwright UI tests
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Playwright test dependencies
        run: |
          python -m pip install \
            -r "Day 8 - Playwright basics/requirements.txt" \
            -r "Day 9 - Playwright Framework Design/requirements.txt"
          python -m playwright install --with-deps chromium

      - name: Run browser suites
        run: |
          mkdir -p test-results
          python -m pytest \
            "Day 8 - Playwright basics" \
            "Day 9 - Playwright Framework Design/tests" \
            -v --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --video retain-on-failure \
            --output test-results/playwright-artifacts \
            --junitxml=test-results/playwright-junit.xml \
            --html=test-results/playwright-report.html \
            --self-contained-html

      - name: Upload Playwright reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-and-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
